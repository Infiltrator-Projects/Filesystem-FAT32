name: Qualify and publish independent FAT32 module
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filesystem-fat32-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build and inspection prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils python3 dpkg-dev dosfstools mtools
      - name: Compile and exercise exactly one shared object
        run: make check
      - name: Cross-check independent FAT32 read/write against real dosfstools media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/external-fat
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -I native/filesystems/fat/portable tests/fatfs_v3_realimage_test.c \
            -ldl -o build/external-fat/realtest
          truncate -s 128M build/external-fat/fat32.img
          truncate -s 8M build/external-fat/fat16.img
          mkfs.fat -F 32 -I -s 1 build/external-fat/fat32.img
          mkfs.fat -F 16 -I -s 1 build/external-fat/fat16.img
          build/external-fat/realtest build/FAT32.so build/external-fat/fat32.img build/external-fat/fat16.img
          fsck.fat -n build/external-fat/fat32.img
          mcopy -n -i build/external-fat/fat32.img \
            '::/SUBDIR/Verified Café Ünîcode Data.txt' build/external-fat/external.bin
          python3 - <<'PY'
          from pathlib import Path
          data=Path("build/external-fat/external.bin").read_bytes()
          assert data == bytes((i*17+23)&255 for i in range(1000))
          print("FAT32 independent post-remount file data verified")
          PY
          build/external-fat/realtest build/FAT32.so build/external-fat/fat32.img build/external-fat/fat16.img cleanup
          fsck.fat -n build/external-fat/fat32.img
          echo "FAT32 REAL-WRITE FAT-CHECKER CROSS-VERIFIED"
      - name: Build the DEB and native source installer
        run: make release
      - name: Validate release bytes and native installation
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          bash dist/*.run --help
          sudo bash dist/*.run --profile aggressive --system-package-mode
          version=$(cat VERSION)
          test "$(dpkg-query -W -f='${Version}' infiltrator-filesystem-fat32)" = "${version}+native1"
          python3 standalone/build.py --profile portable --output build/FAT32.so --check
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          lib = Path("/System/Filesystems/FAT32.so")
          info = Path("/System/Resources/Documentation/Filesystem-FAT32/BUILD-INFO").read_text()
          assert "Profile: aggressive\n" in info
          assert "PGO: trained two-pass profile (V1 and V3/V4 fixtures)\n" in info
          assert "-O3 -march=native -mtune=native -flto=auto" in info
          assert f"SHA256: {hashlib.sha256(lib.read_bytes()).hexdigest()}\n" in info
          assert not Path("/System/Filesystems/FAT12.so").exists()
          assert not Path("/System/Filesystems/FAT16.so").exists()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fat32-qualified-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  defrag-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Get the actual Defragmenter host and pinned Common dependency
        uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Defragmenter
          ref: 0e707548d5227fee3654e8467f1cb7ef13a02d2d
          path: .qualification/Defragmenter
          submodules: recursive
      - name: Install source and independent FAT32 image test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake binutils python3 dosfstools mtools
      - name: Exercise the shared SO with real Defragmenter defrag and recovery
        run: |
          make check
          python3 tests/fat32_defrag_compat.py --module build/FAT32.so \
            --defragmenter-source .qualification/Defragmenter
  boot-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check out the released Boot implementation
        uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Boot
          ref: dbc6a710dbe88b78318c8b9afbf47bb64e8706b3
          path: .qualification/Boot
      - name: Install actual OVMF, kernel and ELF qualification tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils python3 gnu-efi qemu-system-x86 ovmf dosfstools mtools busybox-static cpio
      - name: Qualify portable and native SO through the unmodified Boot runtime
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          boot="$root/.qualification/Boot"
          make check
          python3 standalone/build.py --profile aggressive --output build-native/FAT32.so --check
          # Only FAT16-specific fixture names and geometry change; Boot itself does not.
          python3 - "$boot" <<'PY'
          from pathlib import Path
          import sys
          boot=Path(sys.argv[1])
          p=boot/'tests/run-so-tests.sh'
          s=p.read_text().replace('FAT16', 'FAT32').replace('fat16', 'fat32')
          s=s.replace('truncate -s 32M', 'truncate -s 128M')
          s=s.replace('mkfs.fat -F 16 ', 'mkfs.fat -F 32 -s 1 ')
          p.write_text(s)
          p=boot/'tests/so_module_test.c'
          p.write_text(p.read_text().replace('"fat16"', '"fat32"'))
          p=boot/'tests/test_so_boot.py'
          s=p.read_text().replace('FAT16', 'FAT32').replace('fat16', 'fat32')
          s=s.replace('"mkfs.fat", "-F", "16", "-I"', '"mkfs.fat", "-F", "32", "-s", "1", "-I"')
          p.write_text(s)
          PY
          (cd "$boot" && bash scripts/build-gnuefi.sh)
          for profile in build build-native; do
            bash "$boot/tests/run-so-tests.sh" "$root/$profile/FAT32.so" "$root"
          done
          IFS_SO_SANITIZE=1 bash "$boot/tests/run-so-tests.sh" "$root/build/FAT32.so" "$root"
          mkdir -p build/boot-kernel
          package=$(apt-cache depends linux-image-generic | awk '/Depends: linux-image-[0-9]/ {sub("linux-image-", "linux-image-unsigned-", $2); print $2; exit}')
          test -n "$package"
          (cd build/boot-kernel && apt-get download "$package")
          dpkg-deb -x build/boot-kernel/*.deb build/boot-kernel/root
          kernel=$(find "$root/build/boot-kernel/root/boot" -name 'vmlinuz-*' -print -quit)
          test -s "$kernel"
          for profile in build build-native; do
            python3 "$boot/tests/test_so_boot.py" --boot "$boot/refind/refind_x64.efi" \
              --module "$root/$profile/FAT32.so" --kernel "$kernel" \
              --output "$root/build/boot-$profile"
          done
          python3 "$boot/tests/test_so_boot.py" --boot "$boot/refind/refind_x64.efi" \
            --module "$root/build/FAT32.so" --kernel "$kernel" --reject-module \
            --output "$root/build/boot-reject"
  native-efi:
    uses: ./.github/workflows/drivers.yml
  native-kernel:
    uses: ./.github/workflows/kernel.yml
  publish:
    needs: [qualify, defrag-consumer, boot-consumer, native-efi, native-kernel]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fat32-qualified-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: fat32-efi-ovmf-tested
          path: build/native
      - uses: actions/download-artifact@v4
        with:
          name: fat32-ko-qemu-verified
          path: build/native
      - name: Publish exact qualified release once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          version=$(cat VERSION)
          tag="v${version}"
          test -s build/native/FAT32.efi
          test -s build/native/fat32.ko
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Immutable release $tag already exists; retain its published artifacts."
            exit 0
          fi
          install -m 0644 build/native/FAT32.efi dist/FAT32.efi
          install -m 0644 build/native/fat32.ko dist/fat32-linux-6.12.107.ko
          sha256sum dist/*.deb dist/*.run dist/*.efi dist/*.ko
          gh release create "$tag" dist/*.deb dist/*.run dist/*.efi dist/*.ko \
            --target "$GITHUB_SHA" --title "Filesystem FAT32 ${version}" \
            --notes "Independent FAT32.so (source-compiled native RUN) and x86-64 FAT32.efi tested in OVMF. fat32-linux-6.12.107.ko was tested only against pinned Linux 6.12.107 in QEMU and must be rebuilt for the host kernel. General real-media safety, crash recovery, Boot root loading and kernel module signing remain separate."
